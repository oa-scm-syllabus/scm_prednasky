# Based on https://github.com/actions/starter-workflows/blob/main/pages/gatsby.yml
name: CD Deploy page to Github Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm/setup nahrazuje pnpm/action-setup i actions/setup-node:
      # nainstaluje pnpm (verze se bere z pole packageManager v package.json),
      # k tomu Node runtime a rovnou spustí `pnpm install`.
      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
